<body>
    <header>
        <img src="./assets/OG.png" alt="Sensory">
        <div>
            <h1>Sensory</h1>
            <p>A visual interface experiment powered by CSS color-mix. Explore dynamic themes, interactive color systems, and real-time visual transformations.</p>
        </div>
    </header>
    <main id="grid">
        <div class="card">
            <strong class="label">
                <span>Black</span>
                <small>100%</small>
            </strong>
        </div>
        <div class="card">
            <strong class="label">
                <span>Black</span>
                <small>75%</small>
            </strong>
        </div>
        <div class="card">
            <strong class="label">
                <span>Black</span>
                <small>50%</small>
            </strong>
        </div>
        <div class="card">
            <strong class="label">
                <span>Black</span>
                <small>25%</small>
            </strong>
        </div>
        <div class="card">
            <form id="theme-form">
                <input type="text" name="color" id="theme-color-input" placeholder="Color"/>
                <button type="submit" id="theme-color-button">Color!</button>
            </form>
        </div>
        <div class="card">
            <strong class="label">
                <span>White</span>
                <small>25%</small>
            </strong>
        </div>
        <div class="card">
            <strong class="label">
                <span>White</span>
                <small>50%</small>
            </strong>
        </div>
        <div class="card">
            <strong class="label">
                <span>White</span>
                <small>75%</small>
            </strong>
        </div>
        <div class="card">
            <strong class="label">
                <span>White</span>
                <small>100%</small>
            </strong>
        </div>
